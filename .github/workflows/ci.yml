# CI básica (Fase 0, paso 10): la suite completa —incluidas las pruebas de
# integración contra MySQL 8.4 real y las migraciones— corre en cada push.
name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: hrpl_pruebas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3 con las extensiones del proyecto
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, intl, gd, fileinfo, sodium, zip
          coverage: none

      - name: Dependencias de Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Compilar CSS (Tailwind)
        run: |
          npm ci
          npm run css

      - name: Pruebas
        run: vendor/bin/phpunit
